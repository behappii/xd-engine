[package]
name = "xd-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
# Декодирование картинок. Формат PNG — это zlib внутри (Хаффман + LZ77), и
# писать его руками значило бы неделю заниматься архиватором, а не движком.
# default-features = false отключает два десятка форматов, которые здесь не
# нужны: остаются только те, в которых реально лежат текстуры
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
] }
pixels = "0.17.2"
# Пул потоков для растеризации. Своя реализация здесь возможна, но это
# единственное место в проекте, где ошибка даёт не кривой пиксель, а
# неопределённое поведение: постоянному пулу нужно одалживать буфер кадра,
# а у его потоков время жизни 'static, и стыкуется это только через
# стирание времени жизни в unsafe. Такой код правильнее взять обкатанный.
# Сверху бесплатно достаётся work-stealing — он раскладывает полосы экрана
# ровнее, чем любая статическая раздача
rayon = "1.12.0"
winit = "0.30.13"
# Не рендер-крейт, а только определения трейтов (HasWindowHandle /
# HasDisplayHandle) — уже транзитивная зависимость winit, версия здесь
# просто зафиксирована явно. Нужен, чтобы достать из окна нативный хендл
# (NSView на Mac, HWND на Windows, xlib Window на Linux) для Vulkan-поверхности:
# без него пришлось бы лезть в приватные детали winit, которых наружу не видно
raw-window-handle = "0.6.2"
